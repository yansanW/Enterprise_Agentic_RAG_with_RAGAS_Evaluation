name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2

      # Sets up a clean Python environment on the GitHub runner
      - name: Set up Python Runtime
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # Installs your newly generated requirements.txt file
      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Runs your linter/syntax checker (adjust to match your exact tool if different)
      - name: Run Code Quality Checks
        run: |
          pip install flake8
          # Verifies syntax errors, undefined names, and critical issues
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics

  unit-tests:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python Runtime
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Executes your passing pytest test suite on the cloud architecture
      - name: Run Test Suite
        run: |
          pip install pytest pytest-asyncio
          python -m pytest
  
  docker-build:
    needs: code-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t enterpriserag .

      # Optionally run tests inside the container
      - name: Run tests in Docker
        run: docker run --rm --network=host enterpriserag pytest
