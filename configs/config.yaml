# configs/config.yaml
# This is a YAML configuration file for a RAG (Retrieval-Augmented Generation) system. 
# It defines parameters for three main components: ingestion, retrieval, and generation.
provider:
  llm_source: "ollama"        # Options: "google" or "ollama"
  embedding_source: "ollama"  # Options: "google" or "ollama"

models:
  google_llm: "gemini-2.5-flash"
  google_embedding: "models/gemini-embedding-001"
  ollama_llm: "llama3"
  ollama_embedding: "nomic-embed-text" # Standard local embedding model
  temperature: 0.0  # Force maximum deterministic reliability

ingestion:
  parser_strategy: "multimodal_vlm" # Options: "standard_text", "multimodal_vlm"
  splitter_type: "semantic" 
  chunk_size: 500     # Used if static splitter is selected
  chunk_overlap: 50   # Used if static splitter is selected
  # Options: "static", "recursive" or "semantic". "semantic" uses a more advanced method to split text based on meaning, while "recursive" splits text based on fixed rules (e.g., by paragraphs or sentences).
  # for Dynamic & Semantic Chunking Strategies
  breakpoint_threshold_type: "percentile"  # CORRECT: Options: "percentile" or "absolute". Determines how the breakpoint threshold is calculated for semantic chunking.
  breakpoint_threshold_amount: 95  # CORRECT: Controls chunk size when using "percentile" type

vectorstore:
  type: "chroma"  # Options: "chroma", "pinecone", "weaviate", etc.
  # data_dir: "data"  # Used for Chroma
  persist_directory: "vectorstore"  # Used for Chroma
  test_document_path: "data/openrag_slice/documents/2401.11899v3.pdf"  # Path to the test documents for ingestion

retrieval:
  search_type: "mmr"          # Options: "similarity" or "mmr-Maximum Marginal Relevance"
  fetch_k: 20                 # The raw pool size initially pulled from disk (fetch_k)
  base_k: 10                   # The final number of chunks passed to the LLM (k)
  rerank_top_n: 3
  rerank_model: "rerank-v3.5"

evaluation:
  golden_ragas_dataset_path: "data/golden_dataset.json"  # Path to the golden RAGas dataset for evaluation
  metrics: ["faithfulness", "answer_relevance", "context_precision", "context_recall"]  # Metrics to evaluate on
  